@if (section(); as current) {
  <div class="game-header">
    <button (click)="backToLibrary()">← Back to Library</button>
  </div>

  <div class="section-card">
    <p class="section-text">{{ current.text }}</p>

    @if (current.isEnding) {
      <p class="ending-message">The End.</p>
    } @else {
      <div class="options">
        @for (option of current.options; track option.gotoId) {
          <button class="option-button" (click)="choose(option.gotoId)">
            {{ option.description }}
          </button>
        }
      </div>
    }
  </div>
} @else {
  <p>Loading...</p>
}
