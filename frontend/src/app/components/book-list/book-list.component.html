<div class="filters">
  <input
    type="text"
    placeholder="Search adventures..."
    [value]="searchTerm()"
    (input)="onSearchChange($any($event.target).value)"
  />

  <div class="chip-row">
    <button
      class="chip"
      [class.active]="selectedDifficulty() === null"
      (click)="onDifficultyChange(null)"
    >All</button>
    @for (level of ['EASY', 'MEDIUM', 'HARD']; track level) {
      <button
        class="chip"
        [class.active]="selectedDifficulty() === level"
        (click)="onDifficultyChange(level)"
      >{{ level }}</button>
    }
  </div>
</div>

<div class="book-grid">
  @for (book of books(); track book.title) {
    <div class="book-card">
      <h3>{{ book.title }}</h3>
      <p class="author">by {{ book.author }}</p>
      <span class="difficulty-badge">{{ book.difficulty }}</span>
      <p class="chapters">{{ book.chapterCount }} chapters</p>
      <button class="begin-quest" (click)="beginQuest(book.title)">Begin Quest</button>
    </div>
  }
</div>
